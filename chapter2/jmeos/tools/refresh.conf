# refresh.conf — the JMEOS examples of chapter 2 as a JMEOS consumer of MEOS-API's
# tools/refresh-binding.sh. BUILD_CMD runs with $PREFIX (the libmeos install prefix), $CATALOG and
# $JAR exported; it installs JMEOS-fat.jar, the jar the chain builds beside $JAR, as the artifact
# com.example:JMEOS-fat:1.0-SNAPSHOT that pom.xml depends on, then builds the examples.
ENGINE=jmeos-examples
BUILD_DIR=.
JMEOS_COORDS=org.jmeos:meos:1.0
BUILD_CMD='mvn -B -q install:install-file -Dfile="$(dirname "$JAR")/JMEOS-fat.jar" -DgroupId=com.example -DartifactId=JMEOS-fat -Dversion=1.0-SNAPSHOT -Dpackaging=jar && mvn -B clean package'
